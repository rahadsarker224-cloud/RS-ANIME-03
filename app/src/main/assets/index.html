<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>RS ANIME</title>
<style>
:root{
  --bg:#0b0b0d;
  --surface:#161618;
  --surface-2:#1e1e21;
  --primary:#E50914;
  --primary-dark:#B20710;
  --text:#FFFFFF;
  --text-2:#B3B3B3;
  --border:rgba(255,255,255,0.1);
  --radius:8px;
  --footer-h:62px;
  --header-h:58px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);}
body{
  font-family:'Roboto',-apple-system,BlinkMacSystemFont,sans-serif;
  padding-bottom:calc(var(--footer-h) + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img{max-width:100%;}
::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;}

/* ===== Header ===== */
.header{
  position:sticky;top:0;z-index:200;
  height:var(--header-h);
  background:rgba(11,11,13,.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  padding:0 16px;position:relative;
}
.logo{font-size:20px;font-weight:800;letter-spacing:1px;}
.logo span{color:var(--primary);}
.header-right{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:4px;}
.header-left{position:absolute;left:12px;top:50%;transform:translateY(-50%);}
.brand-badge{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.search-toggle,.bell-btn{
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  color:var(--text);position:relative;
}
.bell-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--primary);border:2px solid var(--bg);}
.notif-panel{
  position:absolute;top:calc(var(--header-h) + 6px);right:10px;width:270px;max-height:340px;overflow-y:auto;
  background:var(--surface-2);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 20px 50px rgba(0,0,0,.6);z-index:300;display:none;padding:8px;
}
.notif-panel.show{display:block;}
.notif-item{display:flex;gap:10px;padding:9px;border-radius:8px;align-items:center;}
.notif-item:hover{background:rgba(255,255,255,.05);}
.notif-item img{width:38px;height:38px;border-radius:6px;object-fit:cover;flex-shrink:0;}
.notif-item .t{font-size:12px;font-weight:600;}
.notif-item .s{font-size:10px;color:var(--text-2);}
.search-bar{
  position:absolute;left:0;right:0;top:0;height:var(--header-h);
  background:var(--bg);display:none;align-items:center;padding:0 16px;gap:10px;z-index:5;
}
.search-bar.open{display:flex;}
.search-bar input{
  flex:1;background:rgba(255,255,255,.08);border:1px solid var(--border);
  border-radius:20px;padding:10px 16px;color:var(--text);font-size:14px;
}
.search-bar input:focus{outline:none;border-color:var(--primary);}
.search-close{font-size:20px;color:var(--text-2);padding:4px;}

/* ===== Views ===== */
.view{display:none;}
.view.active{display:block;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* ===== Category Chip Grid (replaces slider) ===== */
.chip-grid-wrap{padding:22px 16px 6px;}
.chip-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;}
.chip{
  padding:13px 24px;border-radius:12px;font-size:14px;font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;background:rgba(255,255,255,.02);cursor:pointer;
  border:2px solid var(--chip-color,#fff);color:var(--chip-color,#fff);
  box-shadow:0 0 14px -4px var(--chip-color,transparent),inset 0 0 10px -6px var(--chip-color,transparent);
  transition:all .2s ease;
}
.chip:active{transform:scale(.95);}
.chip.active{background:var(--chip-color,#fff);color:#0b0b0d;box-shadow:0 0 20px -2px var(--chip-color,transparent);}

/* ===== Ticker banner ===== */
.ticker-banner{
  margin:0 16px 18px;padding:12px 14px;border-radius:12px;background:var(--surface);
  border:1px solid var(--border);display:flex;align-items:center;gap:10px;cursor:pointer;
}
.ticker-icon{width:30px;height:30px;border-radius:8px;background:rgba(229,9,20,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;}
.ticker-text{flex:1;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ticker-text b{color:var(--primary);}
.ticker-arrow{color:var(--text-2);flex-shrink:0;}

/* ===== Poster badges (rating / new) ===== */
.poster-card{position:relative;}
.rating-badge{
  position:absolute;top:6px;right:6px;z-index:2;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);
  color:#ffc93c;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px;display:flex;align-items:center;gap:2px;
}
.new-badge{
  position:absolute;top:6px;left:6px;z-index:2;background:var(--primary);color:#fff;
  font-size:8.5px;font-weight:800;padding:2px 6px;border-radius:5px;letter-spacing:.4px;
}
.section-header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.view-all-link{font-size:11.5px;color:var(--primary);font-weight:700;}

/* ===== Category rows ===== */
.category-section{margin-bottom:24px;padding:0 16px;}
.category-title{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.category-title .bar{width:4px;height:16px;background:var(--primary);border-radius:2px;}
.row-scroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;}
.poster-card{
  width:31%;min-width:31%;max-width:31%;flex:0 0 31%;flex-shrink:0;scroll-snap-align:start;
  border-radius:var(--radius);overflow:hidden;position:relative;
  background:var(--surface);transition:transform .2s;
}
.poster-card:active{transform:scale(.96);}
.poster-card img{width:100%;height:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--surface-2);}
.poster-title{
  position:absolute;bottom:0;left:0;right:0;padding:16px 8px 8px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.9));
  font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ===== Search results ===== */
.search-results{padding:12px 16px;display:none;}
.search-results.show{display:block;}
.search-results .row-scroll{flex-wrap:wrap;overflow:visible;}
.search-results .poster-card{margin-bottom:4px;}

/* ===== Details page ===== */
.details-backdrop{position:relative;width:100%;height:36vh;overflow:hidden;}
.details-backdrop img{width:100%;height:100%;object-fit:cover;}
.details-backdrop::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(11,11,13,.15) 0%, rgba(11,11,13,.3) 60%, var(--bg) 98%);
}
.details-back{
  position:absolute;top:14px;left:14px;z-index:5;
  width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);
}
.hero-play-btn{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;
  width:64px;height:64px;border-radius:50%;background:var(--primary);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 6px rgba(229,9,20,.18),0 10px 30px rgba(229,9,20,.4);
}
.hero-play-btn:active{transform:translate(-50%,-50%) scale(.93);}

.details-split{display:flex;gap:14px;padding:0 16px;margin-top:-64px;position:relative;z-index:2;align-items:flex-end;}
.details-poster{width:110px;flex-shrink:0;border-radius:8px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.6);border:2px solid var(--bg);}
.details-poster img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover;}
.details-right{flex:1;min-width:0;padding-bottom:2px;}
.details-logo{max-height:44px;max-width:100%;object-fit:contain;object-position:left bottom;margin-bottom:8px;display:block;}
.details-title{font-size:19px;font-weight:800;line-height:1.25;margin-bottom:2px;}

.meta-row{padding:0 16px;margin-top:16px;}
.badges-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;}
.pill{font-size:10.5px;padding:5px 11px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text-2);font-weight:600;}
.publisher-pill{display:flex;align-items:center;gap:6px;}
.publisher-pill .dot-icon{width:16px;height:16px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:9px;}
.rating-pill{display:flex;align-items:center;gap:4px;color:#ffc93c;font-weight:700;font-size:11px;border:1px solid #6b5a1c;background:rgba(255,201,60,.08);}
.type-pill{background:var(--primary);color:#fff;border:none;font-weight:700;}
.genre-line{font-size:11.5px;color:var(--text-2);margin-bottom:16px;}

.storyline-card{
  margin:0 16px 18px;padding:16px;border-radius:10px;background:var(--surface);
  border-left:3px solid var(--primary);font-size:13.5px;line-height:1.7;color:var(--text-2);
}

.tab-btn-row{display:flex;gap:10px;padding:0 16px 20px;}
.tab-btn{
  flex:1;padding:14px;border-radius:10px;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.tab-btn.primary-tab{background:#fff;color:#111;}
.tab-btn.dark-tab{background:var(--surface);border:1px solid var(--border);color:var(--text);}
.tab-btn:active{transform:scale(.97);}

.section-heading-row{display:flex;align-items:center;gap:10px;padding:0 16px;margin-bottom:14px;}
.section-heading{font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--text-2);white-space:nowrap;}
.heading-line{flex:1;height:1px;background:var(--border);}

.cast-scroll{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;}
.cast-photo-wrap{flex-shrink:0;width:72px;text-align:center;}
.cast-photo{width:72px;height:90px;border-radius:10px;object-fit:cover;background:var(--surface-2);border:1px solid var(--border);display:block;}
.cast-name{font-size:10.5px;margin-top:6px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ===== Scene screenshots ===== */
.scenes-row{display:flex;gap:10px;padding:0 16px 6px;overflow-x:auto;}
.scene-thumb{flex-shrink:0;width:70%;max-width:280px;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--border);}
.scene-thumb img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;}

/* ===== Episodes section ===== */
.episodes-section{padding:24px 0 6px;}
.season-pills{display:flex;gap:8px;overflow-x:auto;padding:0 16px;margin-bottom:14px;}
.season-pill{
  flex-shrink:0;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;
  background:var(--surface);border:1px solid var(--border);color:var(--text-2);white-space:nowrap;
}
.season-pill.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.episode-list{padding:0 16px;display:flex;flex-direction:column;gap:10px;}
.episode-row-card{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:10px 12px;display:flex;align-items:center;gap:12px;
}
.ep-badge{
  width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
  flex-shrink:0;overflow:hidden;position:relative;
}
.ep-badge img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;}
.ep-badge span{position:relative;z-index:1;text-shadow:0 1px 3px rgba(0,0,0,.8);}
.ep-title-text{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ep-actions{display:flex;align-items:center;gap:14px;flex-shrink:0;}
.ep-dl-btn{color:var(--text-2);display:flex;}
.ep-play-btn{width:34px;height:34px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;}
.ep-play-btn:active,.ep-dl-btn:active{transform:scale(.9);}

.similar-section{padding:22px 0 20px;}

/* ===== Comments ===== */
.comments-section{padding:22px 16px 30px;}
.comment-name-input{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;color:var(--text);font-size:12.5px;margin-bottom:10px;
}
.comment-name-input:focus{outline:none;border-color:var(--primary);}
.comment-input-row{display:flex;gap:10px;align-items:center;margin-bottom:16px;}
.comment-text-input{
  flex:1;background:var(--surface);border:1px solid var(--border);border-radius:24px;
  padding:13px 18px;color:var(--text);font-size:13px;
}
.comment-text-input:focus{outline:none;border-color:var(--primary);}
.comment-send-btn{
  width:46px;height:46px;border-radius:50%;background:var(--primary);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.comment-send-btn:active{transform:scale(.9);}
.comment-item{padding:12px 0;border-bottom:1px solid var(--border);}
.comment-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.comment-author{font-size:13px;font-weight:700;}
.comment-time{font-size:10.5px;color:var(--text-2);}
.comment-text{font-size:13px;color:var(--text-2);line-height:1.5;}

/* ===== Trailer modal ===== */
.trailer-modal{position:fixed;inset:0;background:#000;z-index:950;display:none;flex-direction:column;}
.trailer-modal.show{display:flex;}
.trailer-modal-close{position:absolute;top:16px;right:16px;z-index:5;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:#fff;}
.trailer-modal-body{flex:1;display:flex;align-items:center;justify-content:center;}
.trailer-modal-body iframe,.trailer-modal-body video{width:100%;aspect-ratio:16/9;border:none;}

/* ===== Report FAB ===== */
.report-fab{
  position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));right:18px;z-index:120;
  width:50px;height:50px;border-radius:50%;background:var(--primary);
  display:none;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 10px 24px rgba(229,9,20,.4);
}
.report-fab.show{display:flex;}
.report-fab:active{transform:scale(.92);}

/* ===== Video Player ===== */
.player-overlay{
  position:fixed;inset:0;background:#000;z-index:900;display:none;
  flex-direction:column;
}
.player-overlay.show{display:flex;}
.player-wrap{position:relative;width:100%;flex:1;background:#000;display:flex;align-items:center;}
.player-wrap video{width:100%;max-height:100%;display:block;}
.player-controls{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(180deg,rgba(0,0,0,.6) 0%, transparent 20%, transparent 70%, rgba(0,0,0,.7) 100%);
  opacity:1;transition:opacity .3s;
}
.player-controls.hide{opacity:0;pointer-events:none;}
.pc-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;}
.pc-title{font-size:14px;font-weight:600;flex:1;margin:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pc-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:#fff;}
.pc-center{display:flex;align-items:center;justify-content:center;gap:40px;}
.pc-play{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.pc-bottom{padding:8px 16px 20px;}
.pc-progress-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.pc-time{font-size:11px;color:#ddd;min-width:38px;}
.progress-bar{flex:1;height:4px;background:rgba(255,255,255,.25);border-radius:2px;position:relative;cursor:pointer;}
.progress-fill{height:100%;background:var(--primary);border-radius:2px;width:0%;position:relative;}
.progress-fill::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:var(--primary);}
.pc-actions{display:flex;justify-content:space-between;align-items:center;}
.pc-actions-left{display:flex;gap:18px;align-items:center;}
.download-icon{
  color:#fff;display:flex;align-items:center;gap:6px;font-size:12px;
  animation:none;
}
.download-icon.playing{animation:bounce 1.6s ease infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}

/* ===== Player episode list panel (bottom sheet) ===== */
.player-ep-panel{
  position:fixed;left:0;right:0;bottom:0;max-height:52vh;
  background:rgba(14,14,16,.97);backdrop-filter:blur(14px);
  z-index:950;transform:translateY(100%);transition:transform .3s ease;
  display:flex;flex-direction:column;border-top:1px solid var(--border);
  border-radius:16px 16px 0 0;
}
.player-ep-panel.show{transform:translateY(0);}
.player-ep-panel-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--border);
  font-size:13px;font-weight:700;color:var(--text);flex-shrink:0;
}
.player-ep-panel-list{flex:1;overflow-y:auto;padding:10px 12px calc(14px + env(safe-area-inset-bottom));}
.player-ep-row{
  display:flex;align-items:center;gap:12px;padding:8px;border-radius:8px;margin-bottom:6px;
}
.player-ep-row.active{background:rgba(229,9,20,.18);}
.player-ep-thumb{
  width:88px;height:52px;border-radius:6px;background:var(--surface-2);flex-shrink:0;
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
}
.player-ep-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6;}
.player-ep-thumb span{position:relative;z-index:1;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);}
.player-ep-row.active .player-ep-thumb{box-shadow:0 0 0 2px var(--primary);}
.player-ep-title{font-size:13px;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ===== Cast full-screen modal ===== */
.img-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:600;display:none;align-items:center;justify-content:center;}
.img-modal.show{display:flex;}
.img-modal img{max-width:85%;max-height:70%;border-radius:12px;object-fit:cover;}
.img-modal-close{position:absolute;top:20px;right:20px;color:#fff;font-size:24px;}

/* ===== Footer nav ===== */
.footer-nav{
  position:fixed;bottom:0;left:0;right:0;height:calc(var(--footer-h) + env(safe-area-inset-bottom));
  background:rgba(15,15,17,.95);backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  display:flex;z-index:150;padding-bottom:env(safe-area-inset-bottom);
}
.footer-nav.hide-nav{display:none;}
.fnav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-2);font-size:10px;font-weight:500;transition:color .2s;
}
.fnav-item svg{width:21px;height:21px;}
.fnav-item.active{color:var(--primary);}

.empty-msg{text-align:center;padding:60px 20px;color:var(--text-2);font-size:13px;}
.loader{display:flex;justify-content:center;padding:40px;}
.loader-spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.toast-wrap{position:fixed;bottom:calc(var(--footer-h) + 16px);left:16px;right:16px;z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--primary);padding:11px 16px;border-radius:8px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:slideUp .3s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.toast.hide{animation:fadeOut .3s ease forwards;}
@keyframes fadeOut{to{opacity:0;}}

@media(min-width:700px){
  body{max-width:480px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border);}
  .footer-nav,.header{max-width:480px;left:50%;transform:translateX(-50%);}
  .player-overlay{max-width:480px;left:50%;transform:translateX(-50%);}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header" id="mainHeader">
  <div class="header-left"><div class="brand-badge">RS</div></div>
  <div class="logo">RS <span>ANIME</span></div>
  <div class="header-right">
    <button class="search-toggle" id="searchToggleBtn">

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ===== Native bridge (data comes from Android/Kotlin, not the Firebase Web SDK) ===== */

let ALL_SERIES = {};
const CATEGORIES = ['Hollywood','Bollywood','South Indian','18+'];

function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.classList.add('hide'); setTimeout(()=>el.remove(),300); }, 2800);
}

let activeFilter = 'All';

/* ===== Load all series — pushed from Android's native Firebase listener ===== */
window.onWebDataReceived = function(jsonStr){
  try { ALL_SERIES = JSON.parse(jsonStr) || {}; } catch(e){ ALL_SERIES = {}; }
  renderTicker();
  renderChipGrid();
  renderRecentlyAdded();
  renderTrending();
  renderMovies();
  renderCategories();
  renderNotifPanel();
};

function isNew(item){
  return item.timestamp && (Date.now() - item.timestamp) < 7*24*60*60*1000;
}

/* ===== Category Chip Grid (replaces slider) ===== */
const CHIP_COLORS = ['#ff2fb3','#2effc7','#ffcc33'];
function renderChipGrid(){
  const wrap = document.getElementById('chipGrid');
  const all = ['All', ...CATEGORIES];
  wrap.innerHTML = all.map((cat,i)=>`
    <div class="chip ${cat===activeFilter?'active':''}" style="--chip-color:${CHIP_COLORS[i%CHIP_COLORS.length]}" data-cat="${cat}">${cat}</div>
  `).join('');
  wrap.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      activeFilter = c.dataset.cat;
      renderChipGrid();
      renderCategories();
      document.getElementById('categoriesWrap').scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

/* ===== Ticker banner (latest addition) ===== */
function renderTicker(){
  const banner = document.getElementById('tickerBanner');
  const entries = Object.entries(ALL_SERIES).sort((a,b)=>(b[1].timestamp||0)-(a[1].timestamp||0));
  if(!entries.length){ banner.style.display='none'; return; }
  const [id, item] = entries[0];
  banner.style.display = 'flex';
  banner.innerHTML = `
    <div class="ticker-icon">🎬</div>
    <div class="ticker-text">New Added! <b>${item.title||''}</b> is now available</div>
    <svg class="ticker-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>`;
  banner.onclick = ()=>openDetailByKey(id);
}

/* ===== Recently Added ===== */
function renderRecentlyAdded(){
  const wrap = document.getElementById('recentlyAddedWrap');
  const entries = Object.entries(ALL_SERIES).sort((a,b)=>(b[1].timestamp||0)-(a[1].timestamp||0)).slice(0,10);
  if(!entries.length){ wrap.innerHTML=''; return; }
  wrap.innerHTML = `
    <div class="category-section">
      <div class="section-header-row">
        <div class="category-title" style="margin-bottom:0;"><span class="bar"></span>RECENTLY ADDED</div>
        <span class="view-all-link">View All</span>
      </div>
      <div class="row-scroll">${entries.map(([id,item])=>posterCardHtml(id,item)).join('')}</div>
    </div>`;
}

/* ===== Trending Now (top rated) ===== */
function renderTrending(){
  const wrap = document.getElementById('trendingWrap');
  const entries = Object.entries(ALL_SERIES).filter(([id,item])=>item.rating).sort((a,b)=>(b[1].rating||0)-(a[1].rating||0)).slice(0,10);
  if(!entries.length){ wrap.innerHTML=''; return; }
  wrap.innerHTML = `
    <div class="category-section">
      <div class="section-header-row">
        <div class="category-title" style="margin-bottom:0;"><span class="bar"></span>TRENDING NOW</div>
        <span class="view-all-link">View All</span>
      </div>
      <div class="row-scroll">${entries.map(([id,item])=>posterCardHtml(id,item)).join('')}</div>
    </div>`;
}

/* ===== Movies (dedicated section) ===== */
function renderMovies(){
  const wrap = document.getElementById('moviesWrap');
  const entries = Object.entries(ALL_SERIES).filter(([id,item])=>item.contentType==='Movie').sort((a,b)=>(b[1].timestamp||0)-(a[1].timestamp||0));
  if(!entries.length){ wrap.innerHTML=''; return; }
  wrap.innerHTML = `
    <div class="category-section">
      <div class="section-header-row">
        <div class="category-title" style="margin-bottom:0;"><span class="bar"></span>MOVIES</div>
        <span class="view-all-link">View All</span>
      </div>
      <div class="row-scroll">${entries.map(([id,item])=>posterCardHtml(id,item)).join('')}</div>
    </div>`;
}

/* ===== Categories ===== */
function renderCategories(){
  const wrap = document.getElementById('categoriesWrap');
  const entries = Object.entries(ALL_SERIES);
  if(!entries.length){
    wrap.innerHTML = '<div class="empty-msg">No web series available yet. Check back soon.</div>';
    return;
  }
  const cats = activeFilter === 'All' ? CATEGORIES : [activeFilter];
  let html = '';
  cats.forEach(cat=>{
    const items = entries.filter(([id,item])=>item.category === cat);
    if(!items.length) return;
    html += `
      <div class="category-section">
        <div class="category-title"><span class="bar"></span>${cat}</div>
        <div class="row-scroll">
          ${items.map(([id,item])=>posterCardHtml(id,item)).join('')}
        </div>
      </div>`;
  });
  wrap.innerHTML = html || '<div class="empty-msg">No web series in this category yet.</div>';
}
function posterCardHtml(id, item){
  return `<div class="poster-card" onclick="openDetailByKey('${id}')">
    ${item.rating ? `<div class="rating-badge">★ ${item.rating}</div>` : ''}
    ${isNew(item) ? `<div class="new-badge">NEW</div>` : ''}
    <img src="${item.poster||''}" alt="" loading="lazy">
    <div class="poster-title">${item.title||''}</div>
  </div>`;
}

/* ===== Notification bell ===== */
function renderNotifPanel(){
  const panel = document.getElementById('notifPanel');
  const dot = document.getElementById('bellDot');
  const entries = Object.entries(ALL_SERIES).sort((a,b)=>(b[1].timestamp||0)-(a[1].timestamp||0)).slice(0,8);
  dot.style.display = entries.some(([id,item])=>isNew(item)) ? 'block' : 'none';
  if(!entries.length){ panel.innerHTML = '<div class="empty-msg" style="padding:20px;">No notifications yet.</div>'; return; }
  panel.innerHTML = entries.map(([id,item])=>`
    <div class="notif-item" onclick="closeNotif();openDetailByKey('${id}')">
      <img src="${item.poster||''}" alt="">
      <div><div class="t">${item.title||''}</div><div class="s">Added ${timeAgo(item.timestamp)}</div></div>
    </div>`).join('');
}
document.getElementById('bellBtn').addEventListener('click', e=>{
  e.stopPropagation();
  document.getElementById('notifPanel').classList.toggle('show');
});
function closeNotif(){ document.getElementById('notifPanel').classList.remove('show'); }
document.addEventListener('click', e=>{
  if(!e.target.closest('#notifPanel') && !e.target.closest('#bellBtn')) closeNotif();
});

/* ===== Search ===== */
const searchToggleBtn = document.getElementById('searchToggleBtn');
const searchBar = document.getElementById('searchBar');
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
const categoriesWrap = document.getElementById('categoriesWrap');

function openSearch(){
  searchBar.classList.add('open');
  setTimeout(()=>searchInput.focus(), 100);
}
searchToggleBtn.addEventListener('click', openSearch);
document.getElementById('searchCloseBtn').addEventListener('click', ()=>{
  searchBar.classList.remove('open');
  searchInput.value = '';
  doSearch('');
});
searchInput.addEventListener('input', e=>doSearch(e.target.value.trim()));

function toggleHomeSections(show){
  ['categoriesWrap','recentlyAddedWrap','trendingWrap','moviesWrap','chipGridWrap','tickerBanner'].forEach(id=>{
    document.getElementById(id).style.display = show ? '' : 'none';
  });
}
function doSearch(q){
  if(!q){
    searchResults.classList.remove('show');
    toggleHomeSections(true);
    renderTicker();
    return;
  }
  toggleHomeSections(false);
  searchResults.classList.add('show');
  const results = Object.entries(ALL_SERIES).filter(([id,item])=>
    (item.title||'').toLowerCase().includes(q.toLowerCase())
  );
  if(!results.length){
    searchResults.innerHTML = '<div class="empty-msg">No results for "'+q+'"</div>';
    return;
  }
  searchResults.innerHTML = `<div class="row-scroll">${results.map(([id,item])=>posterCardHtml(id,item)).join('')}</div>`;
}

/* ===== Footer nav / view switching ===== */
const views = document.querySelectorAll('.view');
const fnavItems = document.querySelectorAll('.fnav-item');
function switchView(name){
  if(name === 'search'){ openSearch(); return; }
  views.forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  fnavItems.forEach(f=>f.classList.toggle('active', f.dataset.view===name));
  window.scrollTo({top:0});
}
fnavItems.forEach(item=>{
  item.addEventListener('click', ()=>switchView(item.dataset.view));
});

/* ===== Details Page ===== */
let currentDetailId = null;
let currentDetailItem = null;
let currentSeasonIdx = 0, currentEpIdx = 0;

window.openDetailByKey = function(id){
  const item = ALL_SERIES[id];
  if(!item) return;
  currentDetailId = id;
  currentDetailItem = item;
  currentSeasonIdx = 0;
  renderDetails(id, item);
  views.forEach(v=>v.classList.remove('active'));
  document.getElementById('view-details').classList.add('active');
  document.getElementById('mainHeader').style.display = 'none';
  document.getElementById('footerNav').classList.add('hide-nav');
  document.getElementById('reportFab').classList.add('show');
  window.scrollTo({top:0});
};

function closeDetails(){
  document.getElementById('mainHeader').style.display = 'flex';
  document.getElementById('footerNav').classList.remove('hide-nav');
  document.getElementById('reportFab').classList.remove('show');
  switchView('home');
}

function renderDetails(id, item){
  const isMovie = item.contentType === 'Movie';
  const cast = item.topBilledCast || [];
  const seasons = item.seasons || [];
  const genres = item.genres && item.genres.length ? item.genres.join(' · ') : '';
  const screenshots = item.screenshots || [];
  const similar = Object.entries(ALL_SERIES).filter(([sid,s])=> sid!==id && s.category===item.category).slice(0,8);

  const html = `
    <div class="details-backdrop">
      <img src="${item.backdrop||item.poster||''}" alt="">
      <div class="details-back" onclick="closeDetails()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </div>
      <div class="hero-play-btn" id="heroPlayBtn">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="#fff"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      </div>
    </div>
    <div class="details-split">
      <div class="details-poster"><img src="${item.poster||''}" alt=""></div>
      <div class="details-right">
        ${item.logo ? `<img class="details-logo" src="${item.logo}" alt="">` : ''}
        <div class="details-title">${item.title||''}</div>
      </div>
    </div>

    <div class="meta-row">
      <div class="badges-row">
        <span class="pill type-pill">${isMovie ? 'Movie' : 'Web Series'}</span>
        <span class="pill rating-pill">★ ${item.rating||'-'}</span>
        <span class="pill">${item.year||''}</span>
        <span class="pill">${item.language||''}</span>
      </div>
      ${genres ? `<div class="genre-line">${genres}</div>` : ''}
    </div>

    <div class="storyline-card">${item.storyline || 'No description available.'}</div>

    <div class="tab-btn-row">
      <button class="tab-btn primary-tab" id="episodesTabBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#111" stroke-width="2">${isMovie ? '<polygon points="6 3 20 12 6 21 6 3" fill="#111"/>' : '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>'}</svg>
        ${isMovie ? 'Play' : 'Episodes'}
      </button>
      <button class="tab-btn dark-tab" id="trailerTabBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Trailer
      </button>
    </div>

    ${cast.length ? `
    <div class="section-heading-row"><span class="section-heading">Top Billed Cast</span><div class="heading-line"></div></div>
    <div class="cast-scroll" id="castScroll" style="margin-bottom:6px;">
      ${cast.map((c,i)=>`
        <div class="cast-photo-wrap" onclick="openImgModal('${(c.photo||'').replace(/'/g,"")}')">
          <img class="cast-photo" src="${c.photo||''}" alt="">
          <div class="cast-name">${c.name||''}</div>
        </div>`).join('')}
    </div>` : ''}

    ${screenshots.length ? `
    <div class="section-heading-row"><span class="section-heading">Scenes</span><div class="heading-line"></div></div>
    <div class="scenes-row" id="scenesRow">
      ${screenshots.map(s=>`<div class="scene-thumb" onclick="openImgModal('${s.replace(/'/g,"")}')"><img src="${s}" alt=""></div>`).join('')}
    </div>` : ''}

    ${isMovie ? (!item.movieLink ? `
    <div class="episodes-section" id="episodesSection">
      <div class="empty-msg" style="padding:6px 16px 0;text-align:left;">No video link available yet.</div>
    </div>` : `<div id="episodesSection"></div>`) : `
    <div class="episodes-section" id="episodesSection">
      <div class="section-heading-row"><span class="section-heading">Episodes</span><div class="heading-line"></div></div>
      ${seasons.length ? `
        <div class="season-pills" id="seasonPills"></div>
        <div class="episode-list" id="episodeList"></div>
      ` : `<div class="empty-msg" style="padding:20px 16px;text-align:left;">No episodes available yet.</div>`}
    </div>`}

    ${similar.length ? `
    <div class="similar-section">
      <div class="section-heading-row"><span class="section-heading">You May Also Like</span><div class="heading-line"></div></div>
      <div class="row-scroll" style="padding:0 16px;">
        ${similar.map(([sid,s])=>posterCardHtml(sid,s)).join('')}
      </div>
    </div>` : ''}

    <div class="comments-section">
      <div class="section-heading-row"><span class="section-heading">Comments</span><div class="heading-line"></div></div>
      <input type="text" class="comment-name-input" id="commentName" placeholder="Your name">
      <div class="comment-input-row">
        <input type="text" class="comment-text-input" id="commentText" placeholder="Write a comment (max 10 words)...">
        <button class="comment-send-btn" id="postCommentBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div id="commentsList"><div class="loader"><div class="loader-spin"></div></div></div>
    </div>
  `;
  document.getElementById('view-details').innerHTML = html;

  if(!isMovie && seasons.length){
    renderSeasonPills(seasons);
    renderEpisodeList(seasons, currentSeasonIdx);
  }
  document.getElementById('episodesTabBtn').addEventListener('click', ()=>{
    if(isMovie) playMovie(item);
    else document.getElementById('episodesSection').scrollIntoView({behavior:'smooth', block:'start'});
  });
  document.getElementById('trailerTabBtn').addEventListener('click', ()=>openTrailer(item.trailer));
  document.getElementById('heroPlayBtn').addEventListener('click', ()=>{
    if(isMovie) playMovie(item);
    else if(item.trailer) openTrailer(item.trailer);
    else if(seasons.length) playEpisode(0,0);
    else toast('No trailer or episodes available yet');
  });
  document.getElementById('postCommentBtn').addEventListener('click', ()=>postComment(id));
  loadComments(id);
}

function renderSeasonPills(seasons){
  const wrap = document.getElementById('seasonPills');
  wrap.innerHTML = seasons.map((s,i)=>`<div class="season-pill ${i===currentSeasonIdx?'active':''}" data-idx="${i}">Season ${s.seasonNumber}</div>`).join('');
  wrap.querySelectorAll('.season-pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      currentSeasonIdx = Number(p.dataset.idx);
      renderSeasonPills(seasons);
      renderEpisodeList(seasons, currentSeasonIdx);
    });
  });
}
function renderEpisodeList(seasons, seasonIdx){
  const wrap = document.getElementById('episodeList');
  const season = seasons[seasonIdx];
  const episodes = season.episodes || [];
  wrap.innerHTML = episodes.map((ep,i)=>`
    <div class="episode-row-card">
      <div class="ep-badge">${ep.thumbnail?`<img src="${ep.thumbnail}" alt="">`:''}<span>E${ep.episodeNumber}</span></div>
      <div class="ep-title-text">${ep.title || ('Episode '+ep.episodeNumber)}</div>
      <div class="ep-actions">
        <div class="ep-dl-btn" onclick="downloadEpisode('${(ep.link||'').replace(/'/g,"")}')">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </div>
        <div class="ep-play-btn" onclick="playEpisode(${seasonIdx}, ${i})">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="#fff"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        </div>
      </div>
    </div>`).join('');
}
window.downloadEpisode = function(link){
  if(!link){ toast('No video link for this episode'); return; }
  const a = document.createElement('a');
  a.href = link; a.download = ''; a.target = '_blank';
  a.click();
  toast('Download started');
};

/* ===== Trailer modal ===== */
function toEmbedUrl(url){
  if(!url) return null;
  const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{6,})/);
  if(ytMatch) return {type:'youtube', embed: `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1`};
  return {type:'video', embed: url};
}
window.openTrailer = function(url){
  if(!url){ toast('Trailer not available'); return; }
  const info = toEmbedUrl(url);
  const body = document.getElementById('trailerModalBody');
  body.innerHTML = info.type === 'youtube'
    ? `<iframe src="${info.embed}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`
    : `<video src="${info.embed}" controls autoplay playsinline></video>`;
  document.getElementById('trailerModal').classList.add('show');
};
document.getElementById('trailerModalClose').addEventListener('click', ()=>{
  document.getElementById('trailerModal').classList.remove('show');
  document.getElementById('trailerModalBody').innerHTML = '';
});

/* ===== Report FAB ===== */
document.getElementById('reportFab').addEventListener('click', ()=>{
  if(!currentDetailId) return;
  if(window.AndroidApp && AndroidApp.postReport){ AndroidApp.postReport(currentDetailId); }
  toast('Thanks — this has been reported');
});

/* ===== Cast image modal ===== */
window.openImgModal = function(src){
  if(!src) return;
  document.getElementById('imgModalImg').src = src;
  document.getElementById('imgModal').classList.add('show');
};
document.getElementById('imgModalClose').addEventListener('click', ()=>{
  document.getElementById('imgModal').classList.remove('show');
});

/* ===== Video Player ===== */
const videoEl = document.getElementById('videoEl');
const playerOverlay = document.getElementById('playerOverlay');
const playerControls = document.getElementById('playerControls');
const pcPlayIcon = document.getElementById('pcPlayIcon');

window.playEpisode = function(seasonIdx, epIdx){
  currentSeasonIdx = seasonIdx; currentEpIdx = epIdx;
  const season = currentDetailItem.seasons[seasonIdx];
  const ep = season.episodes[epIdx];
  if(!ep.link){ toast('No video link for this episode'); return; }

  videoEl.src = ep.link;
  videoEl.poster = ep.thumbnail || currentDetailItem.backdrop || '';
  document.getElementById('playerTitle').textContent = `${currentDetailItem.title} · S${season.seasonNumber} E${ep.episodeNumber} - ${ep.title||''}`;
  document.getElementById('episodesListBtn').style.display = '';
  updateNextHint();
  playerOverlay.classList.add('show');
  videoEl.play().catch(()=>{});
  if(document.getElementById('playerEpPanel').classList.contains('show')){
    renderPlayerEpisodePanel();
  }
};

window.playMovie = function(item){
  if(!item.movieLink){ toast('No video link for this movie'); return; }
  document.getElementById('playerEpPanel').classList.remove('show');
  videoEl.src = item.movieLink;
  videoEl.poster = item.backdrop || item.poster || '';
  document.getElementById('playerTitle').textContent = item.title || '';
  document.getElementById('episodesListBtn').style.display = 'none';
  document.getElementById('nextEpHint').textContent = '';
  playerOverlay.classList.add('show');
  videoEl.play().catch(()=>{});
};

/* ===== Player episode list panel ===== */
function renderPlayerEpisodePanel(){
  if(!currentDetailItem || !currentDetailItem.seasons) return;
  const season = currentDetailItem.seasons[currentSeasonIdx];
  if(!season) return;
  document.getElementById('playerEpSeasonNum').textContent = season.seasonNumber;
  const list = document.getElementById('playerEpPanelList');
  list.innerHTML = (season.episodes||[]).map((ep,i)=>`
    <div class="player-ep-row ${i===currentEpIdx?'active':''}" onclick="playEpisodeFromPanel(${i})">
      <div class="player-ep-thumb">${ep.thumbnail?`<img src="${ep.thumbnail}" alt="">`:''}<span>E${ep.episodeNumber}</span></div>
      <div class="player-ep-title">${ep.title || ('Episode '+ep.episodeNumber)}</div>
    </div>`).join('');
}
window.playEpisodeFromPanel = function(idx){
  playEpisode(currentSeasonIdx, idx);
};
document.getElementById('episodesListBtn').addEventListener('click', e=>{
  e.stopPropagation();
  renderPlayerEpisodePanel();
  document.getElementById('playerEpPanel').classList.add('show');
});
document.getElementById('playerEpPanelClose').addEventListener('click', e=>{
  e.stopPropagation();
  document.getElementById('playerEpPanel').classList.remove('show');
});

document.getElementById('playerClose').addEventListener('click', ()=>{
  videoEl.pause();
  videoEl.src = '';
  playerOverlay.classList.remove('show');
  document.getElementById('playerEpPanel').classList.remove('show');
});

const pcPlayBtn = document.getElementById('pcPlayBtn');
pcPlayBtn.addEventListener('click', ()=>{
  if(videoEl.paused) videoEl.play(); else videoEl.pause();
});
videoEl.addEventListener('play', ()=>{
  pcPlayIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  document.getElementById('downloadIcon').classList.add('playing');
});
videoEl.addEventListener('pause', ()=>{
  pcPlayIcon.innerHTML = '<polygon points="6 3 20 12 6 21 6 3"/>';
  document.getElementById('downloadIcon').classList.remove('playing');
});

function fmtTime(s){
  if(!isFinite(s)) return '0:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return m + ':' + String(sec).padStart(2,'0');
}
videoEl.addEventListener('timeupdate', ()=>{
  document.getElementById('curTime').textContent = fmtTime(videoEl.currentTime);
  document.getElementById('progressFill').style.width = (videoEl.currentTime/videoEl.duration*100 || 0) + '%';
});
videoEl.addEventListener('loadedmetadata', ()=>{
  document.getElementById('durTime').textContent = fmtTime(videoEl.duration);
});
document.getElementById('progressBar').addEventListener('click', e=>{
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  videoEl.currentTime = pct * videoEl.duration;
});
document.getElementById('volumeBtn').addEventListener('click', ()=>{
  videoEl.muted = !videoEl.muted;
});
document.getElementById('fullscreenBtn').addEventListener('click', ()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.getElementById('playerWrap').requestFullscreen().catch(()=>{});
});
document.getElementById('downloadIcon').addEventListener('click', ()=>{
  if(!videoEl.src) return;
  const a = document.createElement('a');
  a.href = videoEl.src;
  a.download = '';
  a.target = '_blank';
  a.click();
  toast('Download started');
});

// Auto-continue next episode
videoEl.addEventListener('ended', ()=>{
  if(!currentDetailItem || !currentDetailItem.seasons || !currentDetailItem.seasons.length) return;
  const season = currentDetailItem.seasons[currentSeasonIdx];
  if(!season) return;
  if(season.episodes[currentEpIdx+1]){
    playEpisode(currentSeasonIdx, currentEpIdx+1);
  } else if(currentDetailItem.seasons[currentSeasonIdx+1]){
    playEpisode(currentSeasonIdx+1, 0);
  }
});
function updateNextHint(){
  const season = currentDetailItem.seasons[currentSeasonIdx];
  const hasNext = season.episodes[currentEpIdx+1] || currentDetailItem.seasons[currentSeasonIdx+1];
  document.getElementById('nextEpHint').textContent = hasNext ? 'Auto-plays next episode' : '';
}

// tap to toggle controls
document.getElementById('playerWrap').addEventListener('click', e=>{
  if(e.target.closest('.pc-icon, .pc-play, .progress-bar')) return;
  playerControls.classList.toggle('hide');
});

/* ===== Comments (via native Android/Firebase bridge) ===== */
function loadComments(seriesId){
  if(window.AndroidApp && AndroidApp.loadComments){
    AndroidApp.loadComments(seriesId);
  }
}
window.onCommentsReceived = function(seriesId, jsonStr){
  const list = document.getElementById('commentsList');
  if(!list) return;
  let items;
  try { items = JSON.parse(jsonStr); } catch(e){ items = []; }
  if(!items || !items.length){ list.innerHTML = '<div class="empty-msg" style="padding:24px 0;">Be the first to comment.</div>'; return; }
  items.sort((a,b)=>b.timestamp-a.timestamp);
  list.innerHTML = items.map(c=>`
    <div class="comment-item">
      <div class="comment-head">
        <span class="comment-author">${escapeHtml(c.userName||'Anonymous')}</span>
        <span class="comment-time">${timeAgo(c.timestamp)}</span>
      </div>
      <div class="comment-text">${escapeHtml(c.comment||'')}</div>
    </div>`).join('');
};
function postComment(seriesId){
  const name = document.getElementById('commentName').value.trim();
  let text = document.getElementById('commentText').value.trim();
  if(!name || !text){ toast('Please enter name and comment'); return; }
  const words = text.split(/\s+/);
  if(words.length > 10) text = words.slice(0,10).join(' ');
  const btn = document.getElementById('postCommentBtn');
  btn.disabled = true; btn.style.opacity = '.5';
  if(window.AndroidApp && AndroidApp.postComment){
    AndroidApp.postComment(seriesId, name, text);
  } else {
    toast('Unable to post comment');
    btn.disabled = false; btn.style.opacity = '1';
  }
}
window.onCommentPosted = function(seriesId){
  document.getElementById('commentText').value = '';
  loadComments(seriesId);
  toast('Comment posted');
  const btn = document.getElementById('postCommentBtn');
  btn.disabled = false; btn.style.opacity = '1';
};
window.onCommentPostFailed = function(seriesId){
  toast('Failed to post comment');
  const btn = document.getElementById('postCommentBtn');
  btn.disabled = false; btn.style.opacity = '1';
};
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function timeAgo(ts){
  if(!ts) return '';
  const diff = Date.now() - ts;
  const mins = Math.floor(diff/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+'m ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+'h ago';
  const days = Math.floor(hrs/24);
  return days+'d ago';
}
</script>
